<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1280px;height:670px;padding:0;display:block;position:relative}
.frame{position:absolute;inset:26px;border:2px solid var(--line);border-radius:20px;background:var(--card)}
.inner{position:absolute;inset:26px;padding:52px 60px;display:flex;flex-direction:column}
.tag{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.tag .pill{background:var(--coral);color:#fff;font-size:17px;font-weight:bold;letter-spacing:.08em;border-radius:999px;padding:8px 20px}
.tag span{font-size:17px;color:var(--ink2);letter-spacing:.06em}
h1{font-size:66px;line-height:1.42;letter-spacing:.02em}
.lead{margin-top:34px;font-size:23px;color:var(--ink2);line-height:1.7}
h1 .em{color:var(--coral)}
h1 .line{background:linear-gradient(transparent 68%,var(--coral-t) 68%)}
.badges{margin-top:auto;display:flex;gap:14px}
.b{border:2px solid var(--line);border-radius:12px;padding:12px 20px;font-size:19px;font-weight:bold;text-align:center;background:var(--surface)}
.b small{display:block;font-size:13px;font-weight:normal;color:var(--ink2);margin-top:2px}
.corner{position:absolute;top:-16px;right:44px;background:var(--gold);color:#fff;font-size:17px;font-weight:bold;letter-spacing:.1em;padding:10px 22px;border-radius:10px}
.deco{position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:20px 0 0 20px;background:linear-gradient(180deg,var(--coral),var(--gold),var(--teal))}
</style></head><body>
<div class="frame">
  <div class="deco"></div>
  <div class="corner">保存版</div>
  <div class="inner">
    <div class="tag"><span class="pill">30歳、妊活はじめました</span><span>体験×エビデンスで整理</span></div>
    <h1>妊活のための栄養は、<br><span class="line">そのまま<span class="em">美容の栄養</span>だった。</span></h1>
    <p class="lead">情報の海に疲れたら、この1本から。<br>肌と冷えが先に変わった、30歳の記録と根拠のまとめ。</p>
    <div class="badges">
      <div class="b">根拠のある7つの栄養素<small>国の推奨・研究ベース</small></div>
      <div class="b">巡りを整える温活<small>今日からできる5つ</small></div>
      <div class="b">1週間実践プラン<small>チェックリスト付き</small></div>
    </div>
  </div>
</div>
</body></html>
