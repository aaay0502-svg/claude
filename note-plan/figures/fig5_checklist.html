<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1080px;height:1350px;padding:56px 60px}
h1{font-size:38px}
.sec{margin-top:26px;padding:22px 26px}
.sec h2{font-size:19px;letter-spacing:.1em;color:var(--c);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--t)}
.item{display:flex;align-items:center;gap:14px;font-size:19px;line-height:1.5;padding:7px 0}
.box{width:22px;height:22px;border:2.5px solid var(--c);border-radius:6px;flex:none}
.item small{color:var(--ink2);font-size:14px;margin-left:auto;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
</style></head><body>
<div class="kicker">保存版｜スクショしてスマホに</div>
<h1>妊活×美容の毎日チェックリスト</h1>
<p class="sub">全部できなくてOK。ゼロの日をつくらないことが目標です。</p>
<div class="card sec" style="--c:var(--coral);--t:var(--coral-t)">
  <h2>毎日</h2>
  <div class="grid">
    <div class="item"><div class="box"></div>朝の白湯1杯</div>
    <div class="item"><div class="box"></div>卵か納豆</div>
    <div class="item"><div class="box"></div>昼に鮭かサバ缶</div>
    <div class="item"><div class="box"></div>間食はナッツ</div>
    <div class="item"><div class="box"></div>湯船に10分</div>
    <div class="item"><div class="box"></div>葉酸サプリ400μg</div>
  </div>
</div>
<div class="card sec" style="--c:var(--teal);--t:var(--teal-t)">
  <h2>週単位</h2>
  <div class="item"><div class="box"></div>赤身肉かレバー<small>週2回</small></div>
  <div class="item"><div class="box"></div>牡蠣か牛肉<small>週1回</small></div>
  <div class="item"><div class="box"></div>ブロッコリーかほうれん草<small>週3回</small></div>
</div>
<div class="card sec" style="--c:var(--gold);--t:var(--gold-t)">
  <h2>ヘトヘトの日の最低ライン</h2>
  <div class="item"><div class="box"></div>葉酸サプリだけ飲む</div>
  <div class="item"><div class="box"></div>コンビニでゆで卵ひとつ</div>
  <div class="item"><div class="box"></div>シャワー後、足首にお湯1分</div>
</div>
<div class="card sec" style="--c:var(--teal);--t:var(--teal-t)">
  <h2>2週間ごとの振り返り</h2>
  <div class="item"><div class="box"></div>手足の冷え、変わった？</div>
  <div class="item"><div class="box"></div>顔色・むくみは？</div>
  <div class="item"><div class="box"></div>朝のだるさは？</div>
</div>
<div class="foot"><span>体は今日も、食べたものでつくられています。</span><span>保存版チェックリスト</span></div>
</body></html>
